name: Build and deploy tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/updates.json'
  workflow_dispatch:
  workflow_run:
    workflows: ["Monitor official DORA sources"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate records snapshot
        run: npm run validate:records

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Lint
        run: npm run lint

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # The repository Pages source is enabled in Settings; no admin token is needed here.
          enablement: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
