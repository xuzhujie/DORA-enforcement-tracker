name: Monitor official DORA sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official pages
        id: check
        run: python3 scripts/check_updates.py

      - name: Add run summary
        run: |
          echo "## DORA source monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed: ${{ steps.check.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "New updates: ${{ steps.check.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated snapshot
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/updates.json
          git commit -m "chore: refresh DORA source snapshot"
          git push
